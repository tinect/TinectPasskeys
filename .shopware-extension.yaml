compatibility_date: '2026-02-11'
build:
    zip:
        assets:
            enabled: true
            enable_es_build_for_admin: true
            enable_es_build_for_storefront: true
validation:
    ignore:
        # Shopware 6.7.0 marks EntitySearchResult as deprecated (it will no longer extend EntityCollection with 6.8),
        # later 6.7 versions removed that deprecation and getEntities() is the intended replacement.
        - identifier: 'phpstan/method.deprecatedClass'
          path: src/Controller/PasskeyController.php
        - identifier: 'phpstan/method.deprecatedClass'
          path: src/Service/PasswordLoginService.php
