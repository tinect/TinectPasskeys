name: Test
on:
  push:
    branches:
      - 'main'
    tags-ignore:
      - '*'
  pull_request:
  schedule:
    - cron: "5 15 * * *"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # same commands as for local development, see "scripts" in composer.json
      - name: Validate extension
        run: composer check

      - name: Check formatting
        run: |
          composer format
          git diff --exit-code

